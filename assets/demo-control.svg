<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 680" width="440" height="680">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.08"/></filter>
    <clipPath id="chatClip"><rect x="0" y="45" width="440" height="580"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="440" height="680" rx="12" fill="#EDEDED"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="440" height="45" rx="12" fill="#2E2E2E"/>
  <rect x="0" y="22" width="440" height="23" fill="#2E2E2E"/>
  <text x="200" y="30" fill="#FFF" font-family="system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="middle">总控 Bot</text>

  <!-- Avatar - control bot -->
  <circle cx="35" cy="100" r="14" fill="#07C160" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
  </circle>
  <text x="35" y="105" fill="#FFF" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" opacity="0">B
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Message 1: User /start -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
    <rect x="290" y="65" width="120" height="32" rx="6" fill="#95EC69" filter="url(#shadow)"/>
    <text x="300" y="86" fill="#333" font-family="system-ui,sans-serif" font-size="13">/start</text>
    <text x="412" y="110" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">12:01</text>
  </g>

  <!-- Avatar - control bot (appear before message 2) -->
  <circle cx="35" cy="135" r="14" fill="#07C160" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
  </circle>
  <text x="35" y="140" fill="#FFF" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" opacity="0">B
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Message 2: Bot menu -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.4s" fill="freeze"/>
    <rect x="55" y="120" width="310" height="95" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <text x="68" y="138" fill="#333" font-family="system-ui,sans-serif" font-size="12" font-weight="600">欢迎使用 LinkCode！请选择操作：</text>
    <text x="68" y="155" fill="#333" font-family="system-ui,sans-serif" font-size="12">1. 创建新 Agent</text>
    <text x="68" y="172" fill="#333" font-family="system-ui,sans-serif" font-size="12">2. 查看我的 Agent 列表</text>
    <text x="68" y="189" fill="#333" font-family="system-ui,sans-serif" font-size="12">3. 添加新 Bot</text>
    <text x="68" y="206" fill="#333" font-family="system-ui,sans-serif" font-size="12">4. 结束 Agent</text>
    <text x="58" y="228" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10">12:01</text>
  </g>

  <!-- Message 3: User "1" -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.5s" dur="0.4s" fill="freeze"/>
    <rect x="365" y="225" width="45" height="32" rx="6" fill="#95EC69" filter="url(#shadow)"/>
    <text x="378" y="246" fill="#333" font-family="system-ui,sans-serif" font-size="13">1</text>
    <text x="412" y="270" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">12:01</text>
  </g>

  <!-- Message 4: Bot naming prompt -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.4s" fill="freeze"/>
    <rect x="55" y="280" width="280" height="32" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <text x="68" y="301" fill="#333" font-family="system-ui,sans-serif" font-size="12">请为这个 Agent 命名：</text>
    <text x="58" y="325" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10">12:02</text>
  </g>

  <!-- Message 5: User "助手" -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="10s" dur="0.4s" fill="freeze"/>
    <rect x="335" y="335" width="75" height="32" rx="6" fill="#95EC69" filter="url(#shadow)"/>
    <text x="347" y="356" fill="#333" font-family="system-ui,sans-serif" font-size="13">助手</text>
    <text x="412" y="380" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">12:02</text>
  </g>

  <!-- Message 6: Bot confirmation -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="11.5s" dur="0.4s" fill="freeze"/>
    <rect x="55" y="395" width="310" height="50" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <text x="68" y="413" fill="#333" font-family="system-ui,sans-serif" font-size="12">✅ Agent「助手」创建成功</text>
    <text x="68" y="432" fill="#666" font-family="system-ui,sans-serif" font-size="11">正在为你启动 Claude Code 进程...</text>
    <text x="58" y="458" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10">12:02</text>
  </g>

  <!-- Top bar changes to worker bot -->
  <rect x="0" y="460" width="440" height="2" fill="#D0D0D0" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="14s" dur="0.3s" fill="freeze"/>
  </rect>
  <text x="220" y="485" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="1" opacity="0">— ↑ 总控 Bot ｜ 助手 ↓ —</text>

  <!-- Worker bot avatar -->
  <circle cx="35" cy="512" r="14" fill="#1485EE" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="15s" dur="0.3s" fill="freeze"/>
  </circle>
  <text x="35" y="517" fill="#FFF" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" opacity="0">助
    <animate attributeName="opacity" from="0" to="1" begin="15s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Message 7: Worker bot greets proactively -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="15.5s" dur="0.4s" fill="freeze"/>
    <rect x="55" y="498" width="310" height="50" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <text x="68" y="516" fill="#333" font-family="system-ui,sans-serif" font-size="12">你好，我是你的 Claude Code</text>
    <text x="68" y="535" fill="#333" font-family="system-ui,sans-serif" font-size="12">「助手」，有什么需要我做的吗？</text>
    <text x="58" y="561" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10">12:03</text>
  </g>

  <!-- Cursor blinking at the end -->
  <rect x="310" y="538" width="1.5" height="13" fill="#333" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="16.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Reset / loop hint -->
  <text x="220" y="665" fill="#C0C0C0" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">↑ 循环播放</text>
</svg>
