<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" width="440" height="460">
  <!-- Background + border -->
  <rect x="0" y="0" width="440" height="460" fill="#0D0D0D"/>
  <rect x="0.5" y="0.5" width="439" height="459" fill="none" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="440" height="30" fill="#151515"/>
  <rect x="0" y="30" width="440" height="1" fill="#2A2A2A"/>
  <circle cx="14" cy="15" r="5" fill="#444"/>
  <circle cx="28" cy="15" r="5" fill="#444"/>
  <circle cx="42" cy="15" r="5" fill="#444"/>
  <text x="220" y="20" fill="#777" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="11" text-anchor="middle">LinkCode Control</text>

  <!-- ============================================ -->
  <!-- Message 1: You: Hi -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1s" dur="0.35s" fill="freeze"/>
    <text x="24" y="52" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:01</text>
    <text x="24" y="72" fill="#999" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">You: Hi</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 2: Control menu -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="100" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:01</text>
    <text x="24" y="120" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">Control: Welcome to LinkCode! Choose:</text>
    <text x="24" y="142" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  1. New Agent</text>
    <text x="24" y="162" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  2. My Agents</text>
    <text x="24" y="182" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  3. Add Bot</text>
    <text x="24" y="202" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  4. End Agent</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 3: You: 1 -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="6s" dur="0.35s" fill="freeze"/>
    <text x="24" y="232" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:02</text>
    <text x="24" y="252" fill="#999" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">You: 1</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 4: Control asks name -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="7.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="282" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:02</text>
    <text x="24" y="302" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">Control: Name this agent:</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 5: You: DevHelper -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="9s" dur="0.35s" fill="freeze"/>
    <text x="24" y="332" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:02</text>
    <text x="24" y="352" fill="#999" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">You: DevHelper</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 6: Control confirmation -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="10.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="10.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="382" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:03</text>
    <text x="24" y="402" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">Control: Agent "DevHelper" created</text>
    <text x="24" y="422" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="12">  Starting Claude Code...</text>
  </g>

  <!-- ============================================ -->
  <!-- Blinking cursor -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="11s" dur="0.1s" fill="freeze"/>
    <rect x="200" y="416" width="7" height="14" fill="#CCC">
      <animate attributeName="opacity" values="1;0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>