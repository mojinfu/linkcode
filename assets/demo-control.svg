<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 450" width="440" height="450">
  <!-- Terminal window border -->
  <rect x="0" y="0" width="440" height="450" fill="#0D0D0D"/>
  <rect x="0.5" y="0.5" width="439" height="449" fill="none" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="440" height="30" fill="#151515"/>
  <rect x="0" y="30" width="440" height="1" fill="#2A2A2A"/>
  <circle cx="12" cy="15" r="5" fill="#444"/>
  <circle cx="26" cy="15" r="5" fill="#444"/>
  <circle cx="40" cy="15" r="5" fill="#444"/>
  <text x="220" y="20" fill="#777" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="11" text-anchor="middle">LinkCode Control</text>

  <!-- ============================================ -->
  <!-- Message 1: User says hi -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1s" dur="0.35s" fill="freeze"/>
    <text x="24" y="52" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:01</text>
    <text x="24" y="72" fill="#999" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">You: Hi</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 2: Control bot menu -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="100" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:01</text>
    <text x="24" y="120" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">Control: Welcome to LinkCode! Choose:</text>
    <text x="24" y="140" fill="#CCC" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  1. New Agent</text>
    <text x="24" y="158" fill="#CCC" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  2. My Agents</text>
    <text x="24" y="176" fill="#CCC" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  3. Add Bot</text>
    <text x="24" y="194" fill="#CCC" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  4. End Agent</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 3: User selects 1 -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="6s" dur="0.35s" fill="freeze"/>
    <text x="24" y="222" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:02</text>
    <text x="24" y="242" fill="#999" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">You: 1</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 4: Bot asks for name -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="7.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="270" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:02</text>
    <text x="24" y="290" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">Control: Name this agent:</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 5: User names agent -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="9s" dur="0.35s" fill="freeze"/>
    <text x="24" y="318" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:02</text>
    <text x="24" y="338" fill="#999" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">You: DevHelper</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 6: Bot confirmation -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="10.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="10.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="366" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:03</text>
    <text x="24" y="386" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">Control: Agent "DevHelper" created</text>
    <text x="24" y="406" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="12">  Starting Claude Code...</text>
  </g>

  <!-- ============================================ -->
  <!-- Transition divider -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="13s" dur="0.5s" fill="freeze"/>
    <line x1="24" y1="432" x2="416" y2="432" stroke="#2A2A2A" stroke-width="1"/>
    <text x="220" y="448" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10" text-anchor="middle">Your dedicated bot takes over &#x2192;</text>
  </g>
</svg>
