<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 510" width="440" height="510">
  <defs>
    <linearGradient id="topBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <filter id="bubbleShadow">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="0" y="0" width="440" height="510" rx="12"/>
    </clipPath>
  </defs>

  <!-- Phone frame -->
  <g clip-path="url(#screenClip)">
    <!-- Chat background -->
    <rect x="0" y="0" width="440" height="510" fill="#EDEDED"/>

    <!-- Top bar -->
    <rect x="0" y="0" width="440" height="44" fill="url(#topBar)"/>
    <rect x="0" y="44" width="440" height="0.5" fill="#000" opacity="0.3"/>
    <!-- Signal bars icon -->
    <g transform="translate(16,18)">
      <rect x="0" y="6" width="2.5" height="2.5" rx="0.5" fill="#FFF" opacity="0.9"/>
      <rect x="3.5" y="4" width="2.5" height="4.5" rx="0.5" fill="#FFF" opacity="0.9"/>
      <rect x="7" y="1.5" width="2.5" height="7" rx="0.5" fill="#FFF" opacity="0.9"/>
      <rect x="10.5" y="-0.5" width="2.5" height="9" rx="0.5" fill="#FFF" opacity="0.9"/>
    </g>
    <text x="220" y="28" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.5">LinkCode Control</text>
    <!-- Battery icon -->
    <g transform="translate(394,19)">
      <rect x="0" y="2" width="20" height="9" rx="2" fill="none" stroke="#FFF" stroke-width="1" opacity="0.9"/>
      <rect x="20" y="4.5" width="2" height="4" rx="0.5" fill="#FFF" opacity="0.9"/>
      <rect x="2" y="4" width="14" height="5" rx="1" fill="#07C160" opacity="0.9"/>
    </g>

    <!-- ============================================ -->
    <!-- Message 1: User says hi -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="1s" dur="0.4s" fill="freeze"/>
      <rect x="360" y="58" width="64" height="30" rx="6" fill="#95EC69" filter="url(#bubbleShadow)"/>
      <text x="424" y="78" fill="#1A1A1A" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="end">Hi</text>
      <text x="424" y="100" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="end">12:01</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 2: Control bot menu -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="2.5s" dur="0.4s" fill="freeze"/>
      <!-- Avatar -->
      <circle cx="28" cy="116" r="15" fill="#07C160"/>
      <text x="28" y="122" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">B</text>
      <!-- Bubble -->
      <rect x="52" y="116" width="310" height="96" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <text x="66" y="136" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="600">Welcome to LinkCode! Choose:</text>
      <text x="66" y="155" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="12">1. New Agent</text>
      <text x="66" y="174" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="12">2. My Agents</text>
      <text x="66" y="193" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="12">3. Add Bot</text>
      <text x="66" y="212" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="12">4. End Agent</text>
      <text x="54" y="226" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:01</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 3: User selects 1 -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="6s" dur="0.4s" fill="freeze"/>
      <rect x="408" y="232" width="16" height="30" rx="6" fill="#95EC69" filter="url(#bubbleShadow)"/>
      <text x="416" y="252" fill="#1A1A1A" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="middle">1</text>
      <text x="424" y="274" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="end">12:02</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 4: Bot asks for name -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="7.5s" dur="0.4s" fill="freeze"/>
      <!-- Avatar -->
      <circle cx="28" cy="286" r="15" fill="#07C160"/>
      <text x="28" y="292" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">B</text>
      <!-- Bubble -->
      <rect x="52" y="286" width="210" height="30" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <text x="66" y="306" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Name this agent:</text>
      <text x="54" y="329" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:02</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 5: User names agent -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="9s" dur="0.4s" fill="freeze"/>
      <rect x="336" y="340" width="88" height="30" rx="6" fill="#95EC69" filter="url(#bubbleShadow)"/>
      <text x="424" y="360" fill="#1A1A1A" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="end">DevHelper</text>
      <text x="424" y="382" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="end">12:02</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 6: Bot confirmation -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="10.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="10.5s" dur="0.4s" fill="freeze"/>
      <!-- Avatar -->
      <circle cx="28" cy="394" r="15" fill="#07C160"/>
      <text x="28" y="400" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">B</text>
      <!-- Bubble -->
      <rect x="52" y="394" width="310" height="48" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <rect x="52" y="394" width="4" height="48" rx="2" fill="#07C160"/>
      <text x="68" y="414" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Agent "DevHelper" created</text>
      <text x="68" y="432" fill="#888" font-family="system-ui,-apple-system,sans-serif" font-size="11.5">Starting Claude Code…</text>
      <text x="54" y="455" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:03</text>
    </g>

    <!-- ============================================ -->
    <!-- Transition divider -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="13s" dur="0.5s" fill="freeze"/>
      <line x1="52" y1="472" x2="388" y2="472" stroke="#D5D5D5" stroke-width="0.5"/>
      <text x="220" y="490" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="10" text-anchor="middle">Your dedicated bot takes over →</text>
    </g>
  </g>
</svg>
