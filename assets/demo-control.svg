<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 518" width="440" height="518">
  <defs>
    <clipPath id="phoneClip">
      <rect x="0" y="0" width="440" height="518" rx="20"/>
    </clipPath>
  </defs>

  <!-- Phone frame -->
  <g clip-path="url(#phoneClip)">
    <!-- Background -->
    <rect x="0" y="0" width="440" height="518" fill="#0D0D0D"/>

    <!-- Top bar -->
    <rect x="0" y="0" width="440" height="46" fill="#151515"/>
    <rect x="0" y="46" width="440" height="0.5" fill="#2A2A2A"/>
    <!-- Signal bars -->
    <g transform="translate(16, 17)">
      <rect x="0" y="9" width="3" height="3" rx="0.5" fill="#777"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#777"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#777"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#777"/>
    </g>
    <text x="220" y="31" fill="#999" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.5">LinkCode Control</text>
    <!-- Battery icon -->
    <g transform="translate(396, 18)">
      <rect x="0" y="0" width="20" height="10" rx="2" fill="none" stroke="#777" stroke-width="1"/>
      <rect x="20" y="3" width="2" height="4" rx="1" fill="#777"/>
      <rect x="2" y="2" width="14" height="6" rx="1" fill="#777"/>
    </g>

    <!-- ============================================ -->
    <!-- Message 1: User Hi (right) -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1s" dur="0.35s" fill="freeze"/>
      <rect x="376" y="60" width="48" height="32" rx="10" fill="#222"/>
      <text x="400" y="82" fill="#CCC" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="middle">Hi</text>
      <text x="368" y="104" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="end">12:01</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 2: Control menu (left) -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.5s" dur="0.35s" fill="freeze"/>
      <rect x="16" y="118" width="294" height="128" rx="10" fill="#1A1A1A"/>
      <text x="28" y="140" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">[Control]</text>
      <text x="28" y="158" fill="#DDD" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Welcome to LinkCode! Choose:</text>
      <text x="28" y="178" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="12">1. New Agent</text>
      <text x="28" y="196" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="12">2. My Agents</text>
      <text x="28" y="214" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="12">3. Add Bot</text>
      <text x="28" y="232" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="12">4. End Agent</text>
      <text x="28" y="238" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:01</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 3: User selects 1 (right) -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="6s" dur="0.35s" fill="freeze"/>
      <rect x="392" y="248" width="32" height="32" rx="10" fill="#222"/>
      <text x="408" y="270" fill="#CCC" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="middle">1</text>
      <text x="384" y="292" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="end">12:02</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 4: Control asks name (left) -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="7.5s" dur="0.35s" fill="freeze"/>
      <rect x="16" y="306" width="230" height="52" rx="10" fill="#1A1A1A"/>
      <text x="28" y="326" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">[Control]</text>
      <text x="28" y="344" fill="#DDD" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Name this agent:</text>
      <text x="28" y="368" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:02</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 5: User names agent (right) -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="9s" dur="0.35s" fill="freeze"/>
      <rect x="320" y="380" width="104" height="32" rx="10" fill="#222"/>
      <text x="424" y="402" fill="#CCC" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="end">DevHelper</text>
      <text x="416" y="424" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="end">12:02</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 6: Control confirmation (left) -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="10.5s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="10.5s" dur="0.35s" fill="freeze"/>
      <rect x="16" y="436" width="260" height="70" rx="10" fill="#1A1A1A"/>
      <text x="28" y="456" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">[Control]</text>
      <text x="28" y="474" fill="#DDD" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Agent "DevHelper" created</text>
      <text x="28" y="498" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:03</text>
    </g>
  </g>
</svg>