<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" width="440" height="720">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="720" rx="12" fill="#EDEDED"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="440" height="45" rx="12" fill="#2E2E2E"/>
  <rect x="0" y="22" width="440" height="23" fill="#2E2E2E"/>
  <text x="220" y="30" fill="#FFF" font-family="system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="middle">助手</text>

  <!-- Worker bot avatar (reuse for all bot messages) -->
  <circle cx="35" cy="70" r="14" fill="#1485EE" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
  </circle>
  <text x="35" y="75" fill="#FFF" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" opacity="0">助
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- ====== Message 1: User asks to find printer ====== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
    <rect x="190" y="60" width="220" height="48" rx="6" fill="#95EC69" filter="url(#shadow)"/>
    <text x="200" y="78" fill="#333" font-family="system-ui,sans-serif" font-size="12">帮我找一下局域网里有没有</text>
    <text x="200" y="96" fill="#333" font-family="system-ui,sans-serif" font-size="12">小米打印机，然后装好驱动</text>
    <text x="412" y="121" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">12:05</text>
  </g>

  <!-- Typing indicator -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="3s" dur="0.3s" fill="freeze"/>
    <rect x="55" y="130" width="60" height="28" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <circle cx="72" cy="144" r="3" fill="#B0B0B0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="144" r="3" fill="#B0B0B0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="98" cy="144" r="3" fill="#B0B0B0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ====== Message 2: Bot scanning ====== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.4s" fill="freeze"/>
    <rect x="55" y="130" width="240" height="32" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <text x="68" y="151" fill="#333" font-family="system-ui,sans-serif" font-size="12">好的，我先扫描局域网设备...</text>
    <text x="58" y="175" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10">12:05</text>
  </g>

  <!-- ====== Message 3: Bot found printer ====== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.4s" fill="freeze"/>
    <rect x="55" y="190" width="310" height="50" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <text x="68" y="208" fill="#333" font-family="system-ui,sans-serif" font-size="12">发现 1 台打印机：</text>
    <text x="68" y="226" fill="#1485EE" font-family="monospace,sans-serif" font-size="11">Mi Wireless All-in-One Inkjet</text>
    <text x="68" y="244" fill="#666" font-family="system-ui,sans-serif" font-size="11">IP: 192.168.0.35  |  AirPrint ✅</text>
    <text x="58" y="253" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10">12:05</text>
  </g>

  <!-- ====== Message 4: Bot installing driver ====== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.4s" fill="freeze"/>
    <rect x="55" y="268" width="220" height="48" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <text x="68" y="286" fill="#333" font-family="system-ui,sans-serif" font-size="12">正在安装... ✅</text>
    <text x="68" y="305" fill="#333" font-family="system-ui,sans-serif" font-size="12">打印机「小米打印机」已就绪</text>
    <text x="58" y="329" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10">12:05</text>
  </g>

  <!-- ====== Message 5: User asks to print ====== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="11s" dur="0.4s" fill="freeze"/>
    <rect x="290" y="345" width="120" height="32" rx="6" fill="#95EC69" filter="url(#shadow)"/>
    <text x="300" y="366" fill="#333" font-family="system-ui,sans-serif" font-size="12">把桌面 aaa.jpg</text>
    <text x="300" y="382" fill="#333" font-family="system-ui,sans-serif" font-size="12">打印出来</text>
    <text x="412" y="392" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10" text-anchor="end">12:06</text>
  </g>

  <!-- Typing indicator 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="12s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="14s" dur="0.3s" fill="freeze"/>
    <rect x="55" y="408" width="60" height="28" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <circle cx="72" cy="422" r="3" fill="#B0B0B0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="422" r="3" fill="#B0B0B0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="98" cy="422" r="3" fill="#B0B0B0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ====== Message 6: Bot print result ====== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="14.5s" dur="0.4s" fill="freeze"/>
    <rect x="55" y="408" width="250" height="48" rx="6" fill="#FFF" filter="url(#shadow)"/>
    <text x="68" y="426" fill="#333" font-family="system-ui,sans-serif" font-size="12">✅ 已发送到打印机</text>
    <text x="68" y="445" fill="#666" font-family="system-ui,sans-serif" font-size="11">任务 ID 小米打印机-43，请取纸</text>
    <text x="58" y="469" fill="#B0B0B0" font-family="system-ui,sans-serif" font-size="10">12:06</text>
  </g>

  <!-- Pulsing dot on printer icon area to show "printing" -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="15.5s" dur="0.3s" fill="freeze"/>
    <rect x="55" y="475" width="355" height="40" rx="6" fill="#F8F8F8" filter="url(#shadow)"/>
    <text x="75" y="500" fill="#666" font-family="system-ui,sans-serif" font-size="12">🖨️ 小米打印机 — 正在出纸...</text>
    <circle cx="340" cy="495" r="5" fill="#07C160">
      <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ====== Summary banner ====== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="18s" dur="0.5s" fill="freeze"/>
    <rect x="40" y="540" width="360" height="1" fill="#E0E0E0"/>
    <rect x="100" y="555" width="240" height="36" rx="18" fill="#07C160" opacity="0.95"/>
    <text x="220" y="578" fill="#FFF" font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">无需公网 IP，本机直连</text>
  </g>

  <!-- Reset / loop hint -->
  <text x="220" y="660" fill="#C0C0C0" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">↑ 循环播放</text>
</svg>
