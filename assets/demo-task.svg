<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 630" width="440" height="630">
  <defs>
    <linearGradient id="topBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <filter id="bubbleShadow">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="0" y="0" width="440" height="630" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screenClip)">
    <!-- Chat background -->
    <rect x="0" y="0" width="440" height="630" fill="#EDEDED"/>

    <!-- Top bar -->
    <rect x="0" y="0" width="440" height="44" fill="url(#topBar)"/>
    <rect x="0" y="44" width="440" height="0.5" fill="#000" opacity="0.3"/>
    <g transform="translate(16,18)">
      <rect x="0" y="6" width="2.5" height="2.5" rx="0.5" fill="#FFF" opacity="0.9"/>
      <rect x="3.5" y="4" width="2.5" height="4.5" rx="0.5" fill="#FFF" opacity="0.9"/>
      <rect x="7" y="1.5" width="2.5" height="7" rx="0.5" fill="#FFF" opacity="0.9"/>
      <rect x="10.5" y="-0.5" width="2.5" height="9" rx="0.5" fill="#FFF" opacity="0.9"/>
    </g>
    <text x="220" y="28" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.5">DevHelper</text>
    <!-- Online dot -->
    <circle cx="395" cy="22" r="4" fill="#07C160"/>
    <circle cx="395" cy="22" r="4" fill="#07C160" opacity="0.5">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- ============================================ -->
    <!-- Message 1: Bot greeting (moved from SVG A) -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.5s" dur="0.4s" fill="freeze"/>
      <!-- Avatar -->
      <circle cx="28" cy="60" r="15" fill="#1485EE"/>
      <text x="28" y="66" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">D</text>
      <!-- Bubble -->
      <rect x="52" y="60" width="310" height="48" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <text x="66" y="80" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Hi! I'm your Claude Code "DevHelper".</text>
      <text x="66" y="99" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">What can I do for you?</text>
      <text x="54" y="121" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:03</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 2: User task -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="2.5s" dur="0.4s" fill="freeze"/>
      <rect x="200" y="135" width="224" height="48" rx="6" fill="#95EC69" filter="url(#bubbleShadow)"/>
      <text x="212" y="155" fill="#1A1A1A" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Find a Xiaomi printer on my</text>
      <text x="212" y="174" fill="#1A1A1A" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">LAN and set it up</text>
      <text x="424" y="195" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="end">12:05</text>
    </g>

    <!-- Typing indicator -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.3s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" begin="5.5s" dur="0.3s" fill="freeze"/>
      <rect x="52" y="210" width="52" height="26" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <circle cx="67" cy="223" r="2.5" fill="#CCC">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="78" cy="223" r="2.5" fill="#CCC">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.25s" repeatCount="indefinite"/>
      </circle>
      <circle cx="89" cy="223" r="2.5" fill="#CCC">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============================================ -->
    <!-- Message 3: Bot scanning -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="6s" dur="0.4s" fill="freeze"/>
      <circle cx="28" cy="210" r="15" fill="#1485EE"/>
      <text x="28" y="216" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">D</text>
      <rect x="52" y="210" width="210" height="30" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <text x="66" y="230" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Scanning local network…</text>
      <text x="54" y="253" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:05</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 4: Bot found printer -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="8s" dur="0.4s" fill="freeze"/>
      <circle cx="28" cy="265" r="15" fill="#1485EE"/>
      <text x="28" y="271" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">D</text>
      <rect x="52" y="265" width="310" height="64" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <text x="66" y="285" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Found 1 device:</text>
      <text x="66" y="305" fill="#1485EE" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="500">▸ Mi Wireless All-in-One Inkjet</text>
      <text x="66" y="322" fill="#888" font-family="system-ui,-apple-system,sans-serif" font-size="11">192.168.0.35  —  AirPrint ready</text>
      <text x="54" y="342" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:05</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 5: Bot installed -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="11s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="11s" dur="0.4s" fill="freeze"/>
      <circle cx="28" cy="355" r="15" fill="#1485EE"/>
      <text x="28" y="361" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">D</text>
      <rect x="52" y="355" width="210" height="48" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <rect x="52" y="355" width="4" height="48" rx="2" fill="#07C160"/>
      <text x="68" y="375" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Installing driver… ✓</text>
      <text x="68" y="394" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Printer ready!</text>
      <text x="54" y="416" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:05</text>
    </g>

    <!-- ============================================ -->
    <!-- Message 6: User print order -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="14s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="14s" dur="0.4s" fill="freeze"/>
      <rect x="236" y="430" width="188" height="48" rx="6" fill="#95EC69" filter="url(#bubbleShadow)"/>
      <text x="248" y="450" fill="#1A1A1A" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Print aaa.jpg from</text>
      <text x="248" y="469" fill="#1A1A1A" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">my desktop</text>
      <text x="424" y="490" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="end">12:06</text>
    </g>

    <!-- Typing indicator 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="15.5s" dur="0.3s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" begin="17s" dur="0.3s" fill="freeze"/>
      <rect x="52" y="505" width="52" height="26" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <circle cx="67" cy="518" r="2.5" fill="#CCC">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="78" cy="518" r="2.5" fill="#CCC">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.25s" repeatCount="indefinite"/>
      </circle>
      <circle cx="89" cy="518" r="2.5" fill="#CCC">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============================================ -->
    <!-- Message 7: Bot print done -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="17.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="17.5s" dur="0.4s" fill="freeze"/>
      <circle cx="28" cy="505" r="15" fill="#1485EE"/>
      <text x="28" y="511" fill="#FFF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">D</text>
      <rect x="52" y="505" width="230" height="48" rx="6" fill="#FFF" filter="url(#bubbleShadow)"/>
      <rect x="52" y="505" width="4" height="48" rx="2" fill="#07C160"/>
      <text x="68" y="525" fill="#333" font-family="system-ui,-apple-system,sans-serif" font-size="12.5">Sent to printer ✓</text>
      <text x="68" y="544" fill="#888" font-family="system-ui,-apple-system,sans-serif" font-size="11">Job ID xiaomi-printer-43</text>
      <text x="54" y="566" fill="#AAA" font-family="system-ui,-apple-system,sans-serif" font-size="9">12:06</text>
    </g>

    <!-- ============================================ -->
    <!-- Printer status card -->
    <!-- ============================================ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="20s" dur="0.5s" fill="freeze"/>
      <rect x="52" y="580" width="340" height="38" rx="6" fill="#F5F5F5" filter="url(#bubbleShadow)"/>
      <text x="80" y="604" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="12">Xiaomi Printer</text>
      <!-- printing animation dot -->
      <circle cx="260" cy="600" r="4" fill="#07C160">
        <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="275" y="604" fill="#07C160" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="500">Printing…</text>
    </g>
  </g>
</svg>
