<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 570" width="440" height="570">
  <!-- Terminal window border -->
  <rect x="0" y="0" width="440" height="570" fill="#0D0D0D"/>
  <rect x="0.5" y="0.5" width="439" height="569" fill="none" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="440" height="30" fill="#151515"/>
  <rect x="0" y="30" width="440" height="1" fill="#2A2A2A"/>
  <circle cx="12" cy="15" r="5" fill="#444"/>
  <circle cx="26" cy="15" r="5" fill="#444"/>
  <circle cx="40" cy="15" r="5" fill="#444"/>
  <text x="220" y="20" fill="#777" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="11" text-anchor="middle">DevHelper</text>

  <!-- ============================================ -->
  <!-- Message 1: Bot greeting -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="52" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:03</text>
    <text x="24" y="72" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">DevHelper: Hi! I'm your Claude Code "DevHelper".</text>
    <text x="24" y="92" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  What can I do for you?</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 2: User task -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="120" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:05</text>
    <text x="24" y="140" fill="#999" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">You: Find a Xiaomi printer on my LAN and set it up</text>
  </g>

  <!-- Typing indicator -->
  <text x="24" y="168" fill="#666" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.25s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="5.5s" dur="0.25s" fill="freeze"/>
    DevHelper: ...
  </text>

  <!-- ============================================ -->
  <!-- Message 3: Bot scanning -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="6s" dur="0.35s" fill="freeze"/>
    <text x="24" y="196" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:05</text>
    <text x="24" y="216" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">DevHelper: Scanning local network...</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 4: Bot found printer -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="8s" dur="0.35s" fill="freeze"/>
    <text x="24" y="244" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:05</text>
    <text x="24" y="264" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">DevHelper: Found 1 device:</text>
    <text x="24" y="286" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  &#x25B8; Mi Wireless All-in-One Inkjet</text>
    <text x="24" y="306" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="12">  192.168.0.35  &#x2014;  AirPrint ready</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 5: Bot installed driver -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="11s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="11s" dur="0.35s" fill="freeze"/>
    <text x="24" y="334" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:05</text>
    <text x="24" y="354" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">DevHelper: Installing driver... OK</text>
    <text x="24" y="374" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">  Printer ready!</text>
  </g>

  <!-- ============================================ -->
  <!-- Message 6: User print order -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="14s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="14s" dur="0.35s" fill="freeze"/>
    <text x="24" y="402" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:06</text>
    <text x="24" y="422" fill="#999" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">You: Print aaa.jpg from my desktop</text>
  </g>

  <!-- Typing indicator 2 -->
  <text x="24" y="450" fill="#666" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="15.5s" dur="0.25s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="17s" dur="0.25s" fill="freeze"/>
    DevHelper: ...
  </text>

  <!-- ============================================ -->
  <!-- Message 7: Bot print done -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="17.5s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="17.5s" dur="0.35s" fill="freeze"/>
    <text x="24" y="478" fill="#555" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="10">12:06</text>
    <text x="24" y="498" fill="#DDD" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="13">DevHelper: Sent to printer OK</text>
    <text x="24" y="518" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="12">  Job ID xiaomi-printer-43</text>
  </g>

  <!-- ============================================ -->
  <!-- Printer status line -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="20s" dur="0.5s" fill="freeze"/>
    <text x="24" y="546" fill="#AAA" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="12">  Xiaomi Printer</text>
    <circle cx="156" cy="542" r="3" fill="#AAA">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="166" y="546" fill="#888" font-family="SF Mono,Menlo,Monaco,Courier New,monospace" font-size="12">Printing...</text>
  </g>
</svg>
